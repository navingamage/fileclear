# FileClear.
#
# The marketing site and the application are one Worker on one hostname. Assets
# are checked before the script runs, so /, /privacy, /terms and /support are
# files, and every path with no matching file falls through to src/index.ts.

name = "fileclear"
main = "src/index.ts"
compatibility_date = "2026-09-08"

# One address. A workers.dev URL beside the custom domain is a second copy of
# the same pages for a search engine to find and rank.
workers_dev = false
preview_urls = false

# The application owns the domain, the way TradeClear owns tradeclear.ca. A
# director typing the name wants their filing calendar, not a page describing
# one. fileclear.antipodetech.com redirects here.
routes = [{ pattern = "fileclear.ca", custom_domain = true }]

[assets]
# Relative to this file. The marketing pages sit at the repository root beside
# worker/, so that the application Worker can serve them later without moving.
directory = "../site"
binding = "ASSETS"

# "none" deliberately, now that there is a script. The other values would have
# the asset layer answer unmatched paths, and unmatched is exactly what has to
# reach the Worker: /dashboard, /onboarding and /signin are not files. The
# Worker renders its own 404 for anything it does not recognise either.
not_found_handling = "none"

# html_handling stays at its default, "auto-trailing-slash": /support serves
# support.html and /support.html redirects to /support. The canonical links
# point at the extensionless form, so that behaviour has to hold.

[observability]
enabled = true

# The Mac and Windows builds, and the feed the desktop app updates itself from.
#
# Served through the Worker at /download/* rather than from a public bucket
# domain, for two reasons. The repository is private, so electron-updater's
# GitHub provider would need a token shipped inside every copy of the app, which
# is a credential handed to everybody who downloads it. And an installer should
# come from the product's own domain: one fetched from a personal GitHub account
# is the shape of a thing a person should not run.
#
# Nothing in here is secret. These are public files by design, and what protects
# somebody from a tampered build is the code signature on it rather than an
# access control on the bucket.
#
# Named for what it holds, and named a second time. The first attempt was
# created against the wrong location hint, and R2 keeps a bucket name tied to
# its first placement even across a delete, so recreating it under the same name
# left it in Western Europe for a Canadian product. A fresh name takes the hint.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "fileclear-releases"

# Company profiles, accounts and what has been ticked off. Filings themselves are
# not stored: they are computed from the profile on every read, so a corrected
# rule reaches every company at once rather than only the ones created after it.
[[d1_databases]]
binding = "DB"
database_name = "fileclear"
database_id = "95918583-9d63-4186-a3f8-507439e0d12a"

# The daily reminder sweep. Both hours fire and src/cron.ts returns immediately
# unless the local hour in America/Toronto is 07, which is 12:00 UTC through the
# winter and 11:00 through the summer. Scheduling both is what avoids editing
# this file twice a year.
[triggers]
crons = ["0 11 * * *", "0 12 * * *"]

# Secrets, set with `wrangler secret put <name>`, never written to this file:
#   ZEPTOMAIL_TOKEN        transactional mail
#   STRIPE_SECRET_KEY      billing. The live restricted key. It can create
#                          checkout and billing portal sessions, which is what
#                          the running app needs, but it cannot read
#                          subscriptions or manage webhook endpoints
# A secret set with `wrangler secret put` takes a few seconds to reach every
# edge location. Testing a webhook signature immediately after setting the
# secret produces one puzzling rejection and then works, which reads exactly
# like a mangled secret. Wait, or retry, before concluding anything.
#
#   STRIPE_WEBHOOK_SECRET  signs the webhook. Without it the endpoint refuses
#                          every request rather than trusting an unsigned one
#
# On ZeptoMail specifically: Without it the sweep still runs, finds what is due, and reports
# that it could not send: a scheduled job that throws on a missing secret takes
# every other company's reminder down with it.

[vars]
FC_PUBLIC_ORIGIN = "https://fileclear.ca"

# Addresses, not secrets, so they are versioned here.
#
# fileclear.ca is a mail domain in its own right, the way peaberry.ca is:
# ZeptoMail sends from it, Zoho Mail receives at it, and SPF covers both.
#
# The other pattern in the group, which TradeClear uses, is to send from the
# product domain and point every human at hello@antipodetech.com. It was
# rejected here. A message whose From is fileclear.ca and whose Reply-To is a
# different company's domain has the shape of a phishing mail, and this one
# tells a director about a deadline with money attached.
#
# reminders@ is a send-only name and nobody should write to it, so replies are
# aimed at the mailbox instead. Both are Zoho aliases on one user rather than
# separate accounts, which is how peaberry.ca carries hello@ and orders@.
#
# Confirmed end to end on 15 September 2026, by sending from reminders@ to
# hello@ and reading the headers on what arrived: dkim=pass, spf=pass,
# dmarc=pass. Both directions work. That is worth writing down because the
# failure it rules out is the quiet one, where mail sends fine and lands in a
# spam folder for months before anybody notices.
FC_MAIL_FROM = "FileClear <reminders@fileclear.ca>"
FC_MAIL_REPLY_TO = "FileClear <hello@fileclear.ca>"

# The model, overridable so a cheaper or better one can be swapped in without a
# deploy. It classifies bank rows nothing else could identify and turns figures
# the engine already computed into a paragraph. It never computes anything: see
# the line drawn at the top of src/llm.ts, and the guard that discards any
# explanation carrying a number it was not given.
#
# Measured rather than guessed: a classification call is about 70 tokens in and
# 7 out, which is $0.00001. A customer importing monthly for a year costs a
# hundredth of a cent.
FC_LLM_MODEL = "google/gemini-2.5-flash-lite"

# Where the rate watch reports. Internal, never shown to a customer.
#
# Every rate in this product is a constant compiled into the Worker, which is a
# claim about the outside world that was true the day it was typed. src/watch.ts
# rechecks those claims weekly against CRA and Corporations Canada and writes
# here when something moves. See src/rules/sources.ts for what is watched.
FC_WATCH_TO = "hello@antipodetech.com"

# Stripe price identifiers, not secrets: they are visible in the checkout URL.
#
# LIVE mode. Real cards are charged against these. The test mode equivalents,
# kept here so a sandbox can be pointed back at them, were
# price_1UEHsy2OOsaIaWLu1UCUWazw and price_1UEHsy2OOsaIaWLuEam8KdFl.
FC_PRICE_MONTHLY = "price_1UEIl6RxWnn6cQ10S1ebvuIi"   # $29 CAD per month
FC_PRICE_YEARLY  = "price_1UEIl6RxWnn6cQ10SQZjuI3o"   # $290 CAD per year
