# The generated site, checked against its generator.
#
# site/*.html is committed, because Workers Builds has no Python and the deploy
# needs the files to already exist. That leaves one way to be wrong: edit
# Scripts/build-site.py, forget to run it, and ship HTML that no longer matches
# the source it came from. Nothing at deploy time would notice.
#
# So regeneration happens here, where Python is available, and the job fails if
# anything moved. Same shape as the layout job in TradeClear: the half that
# cannot run where the deploy runs, runs where it can.
#
# Scoped to the paths it actually checks. It was running on every push to main,
# which on a private repository is a minute of the monthly allowance spent to
# confirm that a change to the Worker did not alter the marketing HTML. Of the
# eighteen runs before this, most were that.
#
# Scripts/release-mac.sh makes the same check before it builds, so this is a
# second line rather than the only one.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/build-site.py'
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'Scripts/build-site.py'
      - 'site/**'

jobs:
  generated-html-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate
        run: python3 Scripts/build-site.py

      - name: Fail if the committed HTML is behind its generator
        run: |
          if ! git diff --quiet -- site; then
            echo "site/ does not match Scripts/build-site.py."
            echo "Run: python3 Scripts/build-site.py, then commit the result."
            git diff --stat -- site
            exit 1
          fi
          echo "site/ is current."
